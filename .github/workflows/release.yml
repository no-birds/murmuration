# REHEARSAL workflow (initial commit). Manual only, hard-wired version 0.0.1, never auto-publishes.
# The production workflow replaces this file in a single later commit; it is kept outside
# .github/workflows as release-final.yml.draft until then.
name: Release (rehearsal)

on:
  workflow_dispatch:

# One run at a time; a queued run is never cancelled by a newer one in progress.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REHEARSAL_VERSION: 0.0.1

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preconditions
        id: v
        run: |
          source scripts/lib.sh
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "rehearsal runs only from main, got $GITHUB_REF"; exit 1; }
          require_release_semver "$REHEARSAL_VERSION"
          # No tags are created here; only the remote is looked at.
          scripts/verify.sh "$REHEARSAL_VERSION" absent
          echo "version=$REHEARSAL_VERSION" >> "$GITHUB_OUTPUT"

  ci:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.guard.outputs.version }}

  # The only job that sees secrets. Third-party actions are pinned by commit SHA; no Gradle cache action.
  publish:
    needs: [guard, ci]
    runs-on: ubuntu-latest
    environment: central
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      # Rehearsal mode: upload to the Portal, wait for VALIDATED, do NOT publish.
      ORG_GRADLE_PROJECT_mavenCentralAutomaticPublishing: 'false'
      ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation: VALIDATED
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-java v6.2.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      # V-6: print the effective mode before the first Portal command and refuse automatic publishing.
      - name: Effective mode
        run: |
          echo "version:               $VERSION"
          echo "automatic publishing:  $ORG_GRADLE_PROJECT_mavenCentralAutomaticPublishing"
          echo "wait for state:        $ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation"
          [ "$ORG_GRADLE_PROJECT_mavenCentralAutomaticPublishing" = "false" ] || { echo "automatic publishing must be off in the rehearsal"; exit 1; }
          [ "$ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation" = "VALIDATED" ] || { echo "rehearsal must wait for VALIDATED"; exit 1; }
          if git grep -n -i -E 'mavenCentralAutomaticPublishing *= *true' -- gradle.properties '*.kts'; then
            echo "automatic publishing is switched on in the build files"
            exit 1
          fi
      - name: Upload to the Portal and wait for VALIDATED
        run: ./gradlew publishToMavenCentral "-Prelease.forceVersion=$VERSION" "-Pmurmuration.buildSha=$GITHUB_SHA" --console=plain
      - name: Summary
        run: |
          {
            echo "### Rehearsal $VERSION uploaded and VALIDATED"
            echo "Nothing is published. Drop the deployment in the Central Portal UI before the real release."
          } >> "$GITHUB_STEP_SUMMARY"

  # Rehearsal verify. In the real release this job polls repo.maven.apache.org until the files appear.
  # A deployment that stops at VALIDATED never reaches that host, so waiting for it here would only time out.
  # The Portal state is awaited inside publish (plugin property above); this job holds no secrets and checks
  # the negative: the rehearsal must not have published anything.
  verify:
    needs: [guard, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Nothing reached Maven Central
        run: scripts/verify.sh "${{ needs.guard.outputs.version }}" absent

  # No tag job: the rehearsal never pushes a tag (and never creates a GitHub Release).
