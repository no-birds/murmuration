[versions]
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
coroutines = "1.11.0"
slf4j = "2.0.20"
logback = "1.6.6"
mockk = "1.14.12"
junit-jupiter = "6.1.3"
google-genai = "2.0.0"
openai-java = "4.101.0"
anthropic-java = "2.75.0"
azure-identity = "1.19.0"
wiremock = "3.13.2"
axion = "1.21.4"
vanniktech-publish = "0.37.0"
dokka = "2.3.0"

[plugins]
axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion" }

[libraries]
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
google-genai = { module = "com.google.genai:google-genai", version.ref = "google-genai" }
openai-java = { module = "com.openai:openai-java", version.ref = "openai-java" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic-java" }
azure-identity = { module = "com.azure:azure-identity", version.ref = "azure-identity" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
# Used by build-logic only (convention plugin applies Kotlin plugins by id).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
vanniktech-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-publish" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
